<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#181824" />
      <stop offset="100%" stop-color="#07070c" />
    </radialGradient>

    <!-- Liquid Gradient -->
    <linearGradient id="liquidGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFB800" />
      <stop offset="50%" stop-color="#FF6321" />
      <stop offset="100%" stop-color="#E04000" />
    </linearGradient>

    <!-- Glow Effect -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <stop offset="0%" stop-color="#FF6321" />
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6321" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#FFB800" stop-opacity="0.3" />
    </linearGradient>

    <linearGradient id="highlightGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.0" />
    </linearGradient>
  </defs>

  <!-- Container Base with Rounded Corner (Classic App Icon Frame) -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)" />
  <rect x="16" y="16" width="480" height="480" rx="108" fill="none" stroke="url(#borderGrad)" stroke-width="6" />

  <!-- IV BAG GRAPHIC -->
  <g transform="translate(0, 10)">
    <!-- Top Hanging Loop Ring -->
    <path d="M 236 70 A 20 20 0 0 1 276 70 C 276 80, 236 80, 236 70 Z" fill="none" stroke="#FF6321" stroke-width="12" stroke-linecap="round" />
    <rect x="238" y="86" width="36" height="20" rx="4" fill="#FF6321" />

    <!-- IV Bag Body -->
    <path d="M 160 120
             C 160 106, 172 100, 186 100
             L 326 100
             C 340 100, 352 106, 352 120
             L 352 350
             C 352 374, 332 390, 308 390
             L 204 390
             C 180 390, 160 374, 160 350
             Z"
          fill="url(#liquidGrad)" filter="url(#glow)" />

    <!-- Bag Outline / Glass Rim -->
    <path d="M 160 120
             C 160 106, 172 100, 186 100
             L 326 100
             C 340 100, 352 106, 352 120
             L 352 350
             C 352 374, 332 390, 308 390
             L 204 390
             C 180 390, 160 374, 160 350
             Z"
          fill="none" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="8" />

    <!-- Glass Reflection Highlight (Left edge) -->
    <path d="M 180 120 L 180 340" stroke="url(#highlightGrad)" stroke-width="10" stroke-linecap="round" fill="none" />

    <!-- Liquid Meniscus / Wave Effect Line -->
    <path d="M 160 170 C 210 185, 300 155, 352 170 L 352 350 C 352 374, 332 390, 308 390 L 204 390 C 180 390, 160 374, 160 350 Z" fill="#FFA500" fill-opacity="0.3" />

    <!-- Measurement Markings on the Right -->
    <line x1="320" y1="160" x2="336" y2="160" stroke="#FFFFFF" stroke-opacity="0.6" stroke-width="4" stroke-linecap="round" />
    <line x1="324" y1="195" x2="336" y2="195" stroke="#FFFFFF" stroke-opacity="0.6" stroke-width="3" stroke-linecap="round" />
    <line x1="320" y1="230" x2="336" y2="230" stroke="#FFFFFF" stroke-opacity="0.6" stroke-width="4" stroke-linecap="round" />
    <line x1="324" y1="265" x2="336" y2="265" stroke="#FFFFFF" stroke-opacity="0.6" stroke-width="3" stroke-linecap="round" />
    <line x1="320" y1="300" x2="336" y2="300" stroke="#FFFFFF" stroke-opacity="0.6" stroke-width="4" stroke-linecap="round" />

    <!-- Vita Detox "VD" Emblem inside the bag -->
    <text x="256" y="260" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="82" font-style="italic" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central" letter-spacing="-2">VD</text>

    <!-- Bottom Port Cap & Drip Chamber -->
    <rect x="236" y="390" width="40" height="24" rx="6" fill="#FF6321" />
    <path d="M 246 414 L 266 414 L 262 445 L 250 445 Z" fill="#FFB800" opacity="0.9" />
    <!-- Tube extending down -->
    <path d="M 256 445 C 256 470, 276 460, 276 480" fill="none" stroke="#FF6321" stroke-width="8" stroke-linecap="round" />

    <!-- Droplet -->
    <circle cx="276" cy="490" r="5" fill="#FFB800" />
  </g>
</svg>